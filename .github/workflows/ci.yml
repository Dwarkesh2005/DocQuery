# ============================================================
# DocQuery — CI Pipeline
# ============================================================
# Runs on every push/PR to main branch.
# Steps: Install → Lint → Test → Build Validation

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docquery_test?schema=public
  JWT_ACCESS_SECRET: ci-test-access-secret-minimum-16-chars
  JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-16-chars
  REDIS_URL: redis://localhost:6379
  EMBEDDING_PROVIDER: mock
  LLM_PROVIDER: mock

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate Docker build
        run: docker build -t docquery:ci .
