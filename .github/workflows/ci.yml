# ============================================================
# DocQuery — Production CI Pipeline
# Phase 10: Production Deployment, SRE & Reliability
# ============================================================
# Runs on every push/PR to main branch.
# Pipeline: Checkout → Dependencies → Prisma Validate & Deploy → Lint → Tests → Restore Verification → Docker Build → Security Audit

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docquery_test?schema=public
  JWT_ACCESS_SECRET: ci-test-access-secret-minimum-16-chars
  JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-16-chars
  REDIS_URL: redis://localhost:6379
  EMBEDDING_PROVIDER: mock
  LLM_PROVIDER: mock

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Lint Verification
        run: npm run lint

      - name: Run Full Automated Test Suite (Phases 1-10)
        run: npx jest --runInBand

      - name: Verify Disaster Recovery Restore Procedure
        run: node scripts/restore-test.js

      - name: Multi-Stage Production Docker Build
        run: docker build -t docquery:ci .

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical
